<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="story_studio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>story_studio</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    App Check debug token for local web development.

    Unlike iOS and Android, web has no debug *provider* class — the SDK reads
    this global instead, and when it is set the reCAPTCHA provider is never
    called. It must be set before Firebase initializes, so it lives here rather
    than in Dart.

    Create one with:
      firebase appcheck:debugtokens:create --app YOUR_WEB_APP_ID --display-name local-dev

    Paste it below. Do not commit a real token, and remove this block before
    building for production.
  -->
  <script>
    // self.FIREBASE_APPCHECK_DEBUG_TOKEN = 'PASTE_YOUR_WEB_DEBUG_TOKEN_HERE';
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
